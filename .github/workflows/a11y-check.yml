name: "Accessibility Check"

on:
  workflow_call:
    inputs:
      feature_path:
        required: true
        type: string
    secrets:
      PROD_ACCOUNT:
        required: true

env:
  BASE_PATH: ${{ inputs.feature_path && format('feature/{0}/', inputs.feature_path) || '' }}

jobs:
  a11y-check:
    permissions:
      contents: read
      id-token: write
    runs-on: codebuild-dpc-static-site-non-prod-${{github.run_id}}-${{github.run_attempt}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.PROD_ACCOUNT }}:role/delegatedadmin/developer/dpc-sandbox-github-actions

      - name: Get build cache bucket name from SSM
        uses: cmsgov/cdap/actions/aws-params-env-action@main
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          params: |
            BUILD_CACHE_BUCKET=/dpc-static-site/prod/buildcachebucket

      - name: Restore Buildx cache from S3
        run: |
          mkdir -p /tmp/.buildx-cache
          aws s3 sync "s3://${BUILD_CACHE_BUCKET}/buildx-cache/" /tmp/.buildx-cache/ || true

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name ci-builder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Build pa11y image
        run: |
          docker buildx build \
            --file Dockerfile.pa11y \
            --tag dpc-static-site-pa11y-ci \
            --load \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache,mode=max \
            .

      - name: Save Buildx cache to S3
        if: ${{ always() && env.BUILD_CACHE_BUCKET }}
        run: |
          aws s3 sync /tmp/.buildx-cache/ "s3://${BUILD_CACHE_BUCKET}/buildx-cache/"

      # Run pa11y-ci in Docker; BASE_PATH is passed through from the step environment
      - name: Run pa11y
        run: docker run --rm -e BASE_PATH dpc-static-site-pa11y-ci > pa11y-results.json

      - name: Save Report to Action Summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Always return pa11y output, regardless if all pages pass/fail. Job will now fail if errors are found, which is intentional
        if: always()
        with:
          script: |
            const fs = require('fs');

            const results = "pa11y-results.json"
            if (!fs.existsSync(results)) {
              core.warning(`${results} not found; pa11y did not produce a report.`);
              return;
            }
            const data = JSON.parse(fs.readFileSync(results, "utf-8"))

            let body = "## Accessibility Report \n\n";
            body += "| Status | URL | Errors |\n";
            body += "| ------ | --- | ------ |\n";

            Object.entries(data.results).forEach(([url, issues]) => {
              body += `${issues.length > 0 ? '❌' : '✅' } | ${url} | ${issues.length} errors |\n`;
            });

            core.summary.addRaw(body).write();
