name: "Accessibility Check"

on:
  workflow_call:
    inputs:
      feature_path:
        required: true
        type: string

env:
  BASE_PATH: ${{ inputs.feature_path && format('feature/{0}/', inputs.feature_path) || '' }}

jobs:
  a11y-check:
    runs-on: codebuild-dpc-static-site-non-prod-${{github.run_id}}-${{github.run_attempt}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build the pa11y image to GitHub Actions cache so Chromium is only re-downloaded when Dockerfile.pa11y changes
      - name: Build pa11y image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.pa11y
          tags: dpc-static-site-pa11y-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run pa11y-ci in Docker; BASE_PATH is passed through from the step environment
      - name: Run pa11y
        run: docker compose run --rm -e BASE_PATH pa11y-ci > pa11y-results.json

      - name: Save Report to Action Summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Always return pa11y output, regardless if all pages pass/fail. Job will now fail if errors are found, which is intentional
        if: always()
        with:
          script: |
            const fs = require('fs');

            const results = "pa11y-results.json"
            const data = JSON.parse(fs.readFileSync(results, "utf-8"))

            let body = "## Accessibility Report \n\n";
            body += "| Status | URL | Errors |\n";
            body += "| ------ | --- | ------ |\n";

            Object.entries(data.results).forEach(([url, issues]) => {
              body += `${issues.length > 0 ? '❌' : '✅' } | ${url} | ${issues.length} errors |\n`;
            });

            core.summary.addRaw(body).write();
